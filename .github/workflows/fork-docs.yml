name: Fork documentation
on:
  pull_request:
    paths:
      [
        "AGENTS.md",
        "docs/**",
        "apps/**",
        "packages/**",
        "scripts/**",
        ".github/workflows/fork-docs.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "AGENTS.md",
        "docs/**",
        "apps/**",
        "packages/**",
        "scripts/**",
        ".github/workflows/fork-docs.yml",
      ]
permissions:
  contents: read
jobs:
  documentation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: node scripts/check-fork-docs.ts
        shell: bash
      - name: Parse Windows installer without executing it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
