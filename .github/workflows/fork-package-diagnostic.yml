name: Fork package diagnostic

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Fork release run containing candidate and predecessor artifacts"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  package:
    if: github.repository == 'unn-corp/t3code' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: windows-x64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Checkout diagnostic tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install diagnostic dependencies
        run: vp install --filter=@t3tools/scripts... --filter=@t3tools/contracts...

      - name: Install Linux desktop runtime dependencies
        if: matrix.target == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnotify4 libsecret-1-0 libgtk-3-0 libnss3 libgbm1 libasound2t64

      - name: Download retained release payloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 2
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name fork-release-candidate
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name fork-release-predecessor --dir predecessor

      # Exercises actual packaged bytes using current tooling. No release receipts are written.
      - name: Diagnose install update and recovery
        shell: bash
        env:
          FORK_RELEASE_TARGET: ${{ matrix.target }}
          FORK_RELEASE_CANDIDATE_DIR: candidate
          FORK_RELEASE_PREDECESSOR_DIR: predecessor
        run: |
          failed=0
          for check in install update recovery; do
            FORK_RELEASE_CHECK="$check" node scripts/fork-release-validate.ts || failed=1
          done
          exit "$failed"
